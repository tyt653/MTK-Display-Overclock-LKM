name: Build Neo7 Turbo Kprobe Module

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Source
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 unzip wget gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libelf-dev

    - name: Download AOSP Kernel
      run: |
        wget https://github.com/aosp-mirror/kernel_common/archive/refs/heads/android14-6.1.zip -O kernel.zip
        unzip kernel.zip
        mv kernel_common-android14-6.1 kernel_source

    - name: Configure Kernel
      run: |
        cd kernel_source
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        # 使用 AOSP 默认配置（它会自动包含标准 Linux 头文件和 modules 支持）
        make gki_defconfig
        make modules_prepare
        cd ..

    - name: Create Makefile
      run: |
        echo "obj-m += kprobe_neo7.o" > src/Makefile

    - name: Compile LKM
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        make -C kernel_source M=$PWD/src modules

    - name: Upload Result
      uses: actions/upload-artifact@v4
      with:
        name: kprobe-ko
        path: "**/*.ko"
