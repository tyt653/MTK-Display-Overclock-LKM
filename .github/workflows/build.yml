name: Build RMX5062 LKM (Real Device Source Fixed)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Source
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python2 gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libelf-dev xz-utils

    - name: Download Kernel
      run: |
        wget https://github.com/realme-kernel-opensource/realme_neo7_turbo-AndroidV-kernel-source/archive/refs/heads/main.zip -O kernel.zip || wget https://github.com/realme-kernel-opensource/realme_neo7_turbo-AndroidV-kernel-source/archive/refs/heads/master.zip -O kernel.zip
        unzip kernel.zip
        mv realme_neo7_turbo-AndroidV-kernel-source-* kernel_source

    - name: Patch Kconfig
      run: |
        python3 -c "
        import os, re
        for root, dirs, files in os.walk('kernel_source'):
            for file in files:
                if file == 'Kconfig':
                    filepath = os.path.join(root, file)
                    with open(filepath, 'r') as f: lines = f.readlines()
                    with open(filepath, 'w') as f:
                        for line in lines:
                            match = re.match(r'\s*source\s+\"([^\"]+)\"', line)
                            if match:
                                rel = match.group(1)
                                if not os.path.exists(os.path.normpath(os.path.join(root, rel))): f.write('#'+line)
                                else: f.write(line)
                            else: f.write(line)
        "
        echo 'Kconfig patch done.'

    - name: Patch C Code
      run: |
        sed -i 's/panel_aa618_p_3_a0034_dsi_vdo/panel_ae037_p_3_a0026_dsi_vdo/g' src/PMB110_185_Mode.c
        sed -i 's/mtk_dsi_set_LFR/tmtk_dsi_set_LFR/g' src/PMB110_185_Mode.c
        sed -i 's/mtk_dsi_porch_setting/tmtk_dsi_porch_setting/g' src/PMB110_185_Mode.c
        sed -i 's/6.12.58-android16-6-g7704a1ae279b-ab15213644-4k/6.1.115-android14-11-o-gc5f8983c0f24/g' src/PMB110_185_Mode.c
        python3 -c "
        f=open('src/PMB110_185_Mode.c','r')
        code=f.read()
        f.close()
        code=code.replace('tmtk_dsi_set_LFR(','((int(*)(void*,unsigned int))kallsyms_lookup_name(\"tmtk_dsi_set_LFR\"))(')
        code=code.replace('tmtk_dsi_porch_setting(','((int(*)(void*,void*))kallsyms_lookup_name(\"tmtk_dsi_porch_setting\"))(')
        f=open('src/PMB110_185_Mode.c','w')
        f.write(code)
        f.close()
        "
        echo 'C code patched.'

    - name: Configure Kernel
      run: |
        cd kernel_source
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        make gki_defconfig
        # 强制解除任何限制
        echo 'CONFIG_MODULES=y' >> .config
        make olddefconfig
        # 绝杀：olddefconfig 之后再次强行写入，覆盖它的重置
        sed -i 's/# CONFIG_MODULES is not set/CONFIG_MODULES=y/g' .config
        sed -i 's/CONFIG_MODULES=n/CONFIG_MODULES=y/g' .config
        make modules_prepare
        cd ..

    - name: Create Makefile
      run: |
        echo 'obj-m += PMB110_185_Mode.o' > src/Makefile
        echo 'ccflags-y += -I$PWD/kernel_source/include' >> src/Makefile
        echo 'ccflags-y += -I$PWD/kernel_source/arch/arm64/include' >> src/Makefile
        echo 'ccflags-y += -I$PWD/kernel_source/drivers/gpu/drm/mediatek' >> src/Makefile

    - name: Compile LKM
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        make -C kernel_source M=$PWD/src modules

    - name: Upload Result
      uses: actions/upload-artifact@v4
      with:
        name: rmx5062-lkm
        path: "**/*.ko"
